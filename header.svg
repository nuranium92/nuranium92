<svg width="600" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: 'Courier New', monospace;
        font-size: 52px;
        font-weight: bold;
        fill: none;
        stroke: #e03030;
        stroke-width: 1.5;
      }
      .n1 { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 0.4s 0.0s ease forwards; }
      .u  { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 0.4s 0.3s ease forwards; }
      .r  { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 0.4s 0.6s ease forwards; }
      .a  { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 0.4s 0.9s ease forwards; }
      .n2 { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 0.4s 1.2s ease forwards; }
      .i  { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 0.4s 1.5s ease forwards; }
      .u2 { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 0.4s 1.8s ease forwards; }
      .m  { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 0.4s 2.1s ease forwards; }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <text x="10"  y="70" class="n1">N</text>
  <text x="80"  y="70" class="u">U</text>
  <text x="148" y="70" class="r">R</text>
  <text x="210" y="70" class="a">A</text>
  <text x="275" y="70" class="n2">N</text>
  <text x="342" y="70" class="i">I</text>
  <text x="375" y="70" class="u2">U</text>
  <text x="442" y="70" class="m">M</text>
</svg>
