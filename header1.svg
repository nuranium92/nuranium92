<svg width="620" height="90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .letter {
        font-family: 'Courier New', monospace;
        font-size: 64px;
        font-weight: bold;
        fill: none;
        stroke: #ffffff;
        stroke-width: 1;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
      }
      .l1 { animation: draw 0.5s 0.0s ease forwards; }
      .l2 { animation: draw 0.5s 0.2s ease forwards; }
      .l3 { animation: draw 0.5s 0.4s ease forwards; }
      .l4 { animation: draw 0.5s 0.6s ease forwards; }
      .l5 { animation: draw 0.5s 0.8s ease forwards; }
      .l6 { animation: draw 0.5s 1.0s ease forwards; }
      .l7 { animation: draw 0.5s 1.2s ease forwards; }
      .l8 { animation: draw 0.5s 1.4s ease forwards; }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <text x="15"  y="68" class="letter l1">N</text>
  <text x="85"  y="68" class="letter l2">U</text>
  <text x="155" y="68" class="letter l3">R</text>
  <text x="220" y="68" class="letter l4">A</text>
  <text x="285" y="68" class="letter l5">N</text>
  <text x="355" y="68" class="letter l6">I</text>
  <text x="405" y="68" class="letter l7">U</text>
  <text x="475" y="68" class="letter l8">M</text>
</svg>
